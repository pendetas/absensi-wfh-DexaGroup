# Port 80 picks the app by host name; 8081 and 8082 are fixed fallbacks for browsers that
# don't resolve *.localhost. Separate host names also give each app its own session cookie.

server {
    listen 80 default_server;
    listen 8081;
    server_name karyawan.localhost;
    root /usr/share/nginx/html/employee;
    include /etc/nginx/snippets/app.conf;
}

server {
    listen 80;
    listen 8082;
    server_name hr.localhost;
    root /usr/share/nginx/html/hr;
    include /etc/nginx/snippets/app.conf;
}
